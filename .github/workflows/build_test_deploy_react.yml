name: Build, Test and Deploy React Application

# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    
# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  build_test:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest 
    
    strategy:
      matrix:
        node-version: [22.x]
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v2
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v2
        with:
          node-version: ${{ matrix.node-version }}
      - name: npm ci, build and test
        run: |
          cd my-app
          npm ci
          npm run build --if-present
          npm test
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Authentificate with npm
        run: echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc
      - name: build and publish package on NPM
        run: |
          git config --global user.email "thomas.barrault@ynov.com"
          git config --global user.name "Thomas Barrault"
          cd my-app
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          NPM_VERSION=$(npm view my-app-barrault version)
          echo "Local version: $LOCAL_VERSION"
          echo "NPM version: $NPM_VERSION"
          if [ "$LOCAL_VERSION" != "$NPM_VERSION" ]; then
            npm publish
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v3
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: my-app/build
  test-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create .env for docker compose
        working-directory: my-app
        run: |
          cat <<EOF > .env
          MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }}
          MYSQL_USER=${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}
          MYSQL_HOST=db
          EOF
      - name: Start docker compose
        working-directory: my-app
        run: docker compose up -d --build
      - name: Show containers
        working-directory: my-app
        run: docker compose ps
      - name: Wait and verify healthchecks
        working-directory: my-app
        run: |
          services=("db" "adminer" "server" "react")
          for service in "${services[@]}"; do
            echo "Checking health for $service..."
            cid=$(docker compose ps -q "$service")
            if [ -z "$cid" ]; then
              echo "Container for $service not found"
              exit 1
            fi
            for i in {1..30}; do
              status=$(docker inspect --format '{{json .State.Health.Status}}' "$cid" 2>/dev/null || echo "\"no-healthcheck\"")
              echo "$service status: $status"
              if [ "$status" = "\"healthy\"" ]; then
                break
              fi
              if [ "$status" = "\"unhealthy\"" ] || [ "$status" = "\"no-healthcheck\"" ]; then
                echo "$service is not healthy"
                docker compose logs "$service" || true
                exit 1
              fi
              sleep 5
            done
            final=$(docker inspect --format '{{json .State.Health.Status}}' "$cid")
            if [ "$final" != "\"healthy\"" ]; then
              echo "$service did not become healthy in time"
              docker compose logs "$service" || true
              exit 1
            fi
          done
      - name: Tear down
        if: always()
        working-directory: my-app
        run: docker compose down -v
  build-docker:
    runs-on: ubuntu-latest
    needs: [build_test, test-docker]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build frontend image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest \
            -f my-app/DockerfileReact my-app
      - name: Push frontend image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest
      - name: Build backend image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/backend:latest \
            -f my-app/DockerfilePython my-app
      - name: Push backend image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/backend:latest
  #Deploy job
  deploy:
  # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{steps.deployment.outputs.page_url}}
    runs-on: ubuntu-latest
    needs: [build_test, test-docker, build-docker]
    # Grant GITHUB_TOKEN the permissions required to make a page deployment
    permissions:
      pages: write
      id-token: write
    # Add a dependency to the build job
    # needs: build_test
    # Specify runner + deployment step
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4