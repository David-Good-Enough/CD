services:

  db:
    image: mysql:9.7

    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD
      - MYSQL_DATABASE
    volumes:
      - ./sql_files:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "mysql -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD -e \"USE $$MYSQL_DATABASE; SELECT 1;\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$f=@fsockopen(\"127.0.0.1\",8080); if($$f){fclose($$f); exit(0);} exit(1);'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
  
  server:
    restart: always
    volumes:
      - ./server.py:/app/server.py
    build:
      context: .
      dockerfile: ./DockerfilePython
    ports:
      - 8000:8000
    environment:
      - MYSQL_HOST=db
      - MYSQL_PORT
      - MYSQL_USER
      - MYSQL_PASSWORD
      - MYSQL_DATABASE
    depends_on:
      - db
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/users', timeout=3)\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  react:
    build:    
      context: .
      dockerfile: ./DockerfileReact
    image: react
    ports:
      - 3000:3000
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - server
    command: npm start
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000', (res) => process.exit(res.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

    
    
    